<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Compass Prototype</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            color: #fff;
            user-select: none;
            /* Prevents text selection while clutching */
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        #sector-display {
            font-size: 4rem;
            font-weight: bold;
            color: #4CAF50;
        }

        #btn-start {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .instruction {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="setup-controls"
        style="text-align:center; padding: 40px; margin-top: 15vh; background: #222; border-radius: 15px; box-shadow: 0 0 20px black; max-width: 400px; margin-left: auto; margin-right: auto; position: relative; z-index: 1000;">
        <h1 style="margin-top:0; color: white;">Music Compass</h1>

        <div style="text-align: left; margin-bottom: 20px; color: #ccc;">
            <label>Navigation Mode:</label>
            <select id="mode-select" style="width: 100%; padding: 10px; margin-top: 5px;">
                <option value="CLUTCH">Clutch (Hold-to-Browse)</option>
                <option value="ALWAYS_ON">Always-On (Tap-to-Lock)</option>
            </select>
        </div>

        <div style="text-align: left; margin-bottom: 20px; color: #ccc;">
            <label>Evaluation Task:</label>
            <select id="task-select" style="width: 100%; padding: 10px; margin-top: 5px;">
                <option value="FAMILIARIZATION">Familiarization (Free Play)</option>
                <option value="ARTIST">Find Random Artists</option>
                <option value="TRACK_MJ_DP">Find Tracks (MJ / Daft Punk)</option>
            </select>
        </div>

        <div style="text-align: left; margin-bottom: 30px; color: #ccc;">
            <label style="display: flex; align-items: center; gap: 10px; cursor: pointer;">
                <input type="checkbox" id="vision-toggle" style="width: 20px; height: 20px;">
                <span style="font-size: 14px;">Simulate Eyes-Free (Blur Screen)</span>
            </label>
        </div>

        <button id="btn-start"
            style="width: 100%; padding: 15px; font-size: 18px; background: #007bff; color: white; border: none; border-radius: 8px; cursor: pointer;">
            Start Prototype
        </button>
    </div>

    <div id="task-modal"
        style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:2000; text-align:center; padding-top: 30vh;">
        <h2 style="color:#aaa; font-family: sans-serif;">NEXT TASK</h2>
        <h1 id="modal-target-text" style="color:cyan; font-size: 32px; margin: 20px; font-family: sans-serif;">--</h1>
        <div style="font-size:14px; color:#666; margin-bottom:30px; font-family: sans-serif;">(Timer starts when you
            click GO)</div>
        <button id="btn-start-task"
            style="padding: 20px 60px; font-size: 24px; background:#4CAF50; color:white; border:none; border-radius:8px; cursor: pointer;">GO</button>
    </div>

    <div id="ui-container" style="display:none;">
        <div id="eval-hud"
            style="margin-bottom: 20px; padding: 10px; background: rgba(50, 50, 50, 0.8); border-radius: 8px;">
            <div style="font-size: 14px; color: #aaa;">CURRENT TASK</div>
            <div id="target-display" style="font-size: 24px; color: cyan; font-weight: bold;">--</div>
            <div id="timer-display" style="font-size: 18px; color: white; margin-top: 5px;">0.0s</div>
        </div>

        <div id="sector-display">--</div>

        <div id="status">initializing...</div>

        <button id="btn-system-toggle">Stop Browsing</button>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
