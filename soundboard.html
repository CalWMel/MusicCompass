<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Compass - Researcher Soundboard</title>
    <style>
        body {
            background-color: #121212;
            color: white;
            font-family: sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        h1 {
            color: #00d2ff;
            text-align: center;
        }

        /* Search Box */
        input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            margin-bottom: 20px;
            border-radius: 8px;
            border: none;
            background: #333;
            color: white;
            box-sizing: border-box;
        }

        input:focus {
            outline: 2px solid #00d2ff;
        }

        /* List Items */
        .result-item {
            background: #222;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 5px solid #444;
            transition: background 0.2s;
        }

        .result-item.active {
            background: #2a2a2a;
            border-left-color: #00ff88;
        }

        /* Color Coding */
        .type-genre {
            border-left-color: #ff9900;
        }

        .type-artist {
            border-left-color: #00d2ff;
        }

        .type-track {
            border-left-color: #00ff88;
        }

        .info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .name {
            font-size: 18px;
            font-weight: bold;
        }

        .meta {
            font-size: 12px;
            color: #888;
        }

        /* Controls */
        .controls {
            display: flex;
            gap: 10px;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            transition: all 0.2s;
        }

        .btn-play {
            padding: 10px 20px;
            background: #444;
            color: white;
            min-width: 80px;
        }

        .btn-stop {
            padding: 10px 15px;
            background: #333;
            color: #ff4444;
            display: none;
            /* Hidden by default */
        }

        /* Active States */
        .active .btn-play {
            background: #00d2ff;
            color: black;
        }

        .active .btn-stop {
            display: block;
        }

        .paused .btn-play {
            background: #ffaa00;
            color: black;
        }

        /* Orange when paused */
    </style>
</head>

<body>

    <h1>Researcher Soundboard</h1>
    <p style="text-align:center; color:#888;">Type to find any sound in the database</p>

    <input type="text" id="search-box" placeholder="Search for Artist or Track..." autofocus>

    <div id="results-container"></div>

    <script src="data.js"></script>

    <script>
        let flatList = [];

        // GLOBAL AUDIO STATE
        let currentAudio = null;      // The actual Audio object
        let currentPath = null;       // The file path string of the playing song
        let activeDiv = null;         // The DOM element currently lit up

        window.onload = function () {
            // Find data
            let rootData = null;
            if (typeof musicData !== 'undefined') rootData = musicData.children || musicData;
            else if (typeof MUSIC_LIBRARY !== 'undefined') rootData = MUSIC_LIBRARY;

            if (!rootData) {
                alert("Error: data.js not found or variable names don't match.");
                return;
            }

            flattenData(rootData, "Library");
            renderResults("");
        };

        function flattenData(nodes, parentName) {
            if (!Array.isArray(nodes)) return;
            nodes.forEach(item => {
                if (item.audio || item.src) {
                    flatList.push({
                        name: item.name,
                        type: determineType(item, parentName),
                        parent: parentName,
                        path: item.audio || item.src
                    });
                }
                if (item.children) flattenData(item.children, item.name);
            });
        }

        function determineType(item, parent) {
            if (item.children && item.children.length > 0) {
                return (parent === "Library") ? "genre" : "artist";
            }
            return "track";
        }

        // --- RENDER UI ---
        const searchBox = document.getElementById('search-box');
        const container = document.getElementById('results-container');

        searchBox.addEventListener('input', (e) => {
            renderResults(e.target.value.toLowerCase());
        });

        function renderResults(query) {
            container.innerHTML = "";
            const matches = flatList.filter(item =>
                item.name.toLowerCase().includes(query) ||
                item.parent.toLowerCase().includes(query)
            );
            const displaySet = matches.slice(0, 50);

            if (displaySet.length === 0) {
                container.innerHTML = "<div style='text-align:center; color:#555'>No matches found</div>";
                return;
            }

            displaySet.forEach(item => {
                const div = document.createElement('div');
                div.className = `result-item type-${item.type}`;

                // Check if this item is currently playing (to keep state on redraw)
                if (currentPath === item.path) {
                    div.classList.add('active');
                    if (currentAudio && currentAudio.paused) div.classList.add('paused');
                    activeDiv = div; // Update reference
                }

                const playText = (currentPath === item.path && currentAudio && !currentAudio.paused) ? "Pause" : "Play";

                div.innerHTML = `
                    <div class="info">
                        <span class="name">${item.name}</span>
                        <span class="meta">${item.type.toUpperCase()} • inside "${item.parent}"</span>
                    </div>
                    <div class="controls">
                        <button class="btn-play">${playText}</button>
                        <button class="btn-stop">⏹</button>
                    </div>
                `;

                // Add Listeners
                const playBtn = div.querySelector('.btn-play');
                const stopBtn = div.querySelector('.btn-stop');

                playBtn.onclick = () => handlePlayClick(item.path, div, playBtn);
                stopBtn.onclick = () => handleStopClick(div, playBtn);

                container.appendChild(div);
            });
        }

        // --- AUDIO LOGIC ---

        function handlePlayClick(path, div, btn) {
            // Case 1: Clicking the SAME song
            if (currentPath === path && currentAudio) {
                if (currentAudio.paused) {
                    // Resume
                    currentAudio.play();
                    div.classList.remove('paused');
                    div.classList.add('active');
                    btn.textContent = "Pause";
                } else {
                    // Pause
                    currentAudio.pause();
                    div.classList.add('paused');
                    btn.textContent = "Play";
                }
                return;
            }

            // Case 2: Clicking a NEW song
            stopAll(); // Reset everything first

            // Start new
            currentAudio = new Audio(path);
            currentPath = path;
            activeDiv = div;

            currentAudio.play().catch(e => alert("File not found"));

            // UI Updates
            div.classList.add('active');
            div.classList.remove('paused');
            btn.textContent = "Pause";

            // Cleanup when song finishes naturally
            currentAudio.onended = () => stopAll();
        }

        function handleStopClick(div, playBtn) {
            stopAll();
        }

        // Helper to reset state completely
        function stopAll() {
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0; // Rewind
            }

            // Reset Variables
            currentAudio = null;
            currentPath = null;

            // Reset UI (All buttons turn back to Play)
            document.querySelectorAll('.result-item').forEach(el => {
                el.classList.remove('active', 'paused');
                const btn = el.querySelector('.btn-play');
                if (btn) btn.textContent = "Play";
            });
        }

    </script>
</body>

</html>
