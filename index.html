<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Compass Prototype</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #222;
            color: #fff;
            user-select: none;
            /* Prevents text selection while clutching */
        }

        #status {
            font-size: 1.2rem;
            margin-bottom: 20px;
        }

        #sector-display {
            font-size: 4rem;
            font-weight: bold;
            color: #4CAF50;
        }

        #btn-start {
            padding: 15px 30px;
            font-size: 1.2rem;
            cursor: pointer;
        }

        .instruction {
            font-size: 0.9rem;
            color: #aaa;
            margin-top: 20px;
        }
    </style>
</head>

<body>

    <div id="setup-controls" style="text-align:center; margin-bottom: 20px;">
        <label for="mode-select" style="font-size: 1.2rem; color: #aaa;">Interaction Mode:</label><br>
        <select id="mode-select"
            style="padding: 10px; font-size: 1rem; margin-top: 10px; background: #333; color: #fff; border: 1px solid #555;">
            <option value="CLUTCH">Clutch (Hold to Browse)</option>
            <option value="ALWAYS_ON">Always-On (Tap to Select)</option>
        </select>
    </div>

    <button id="btn-start">Start / Request Permissions</button>

    <div id="ui-container" style="display:none; text-align:center;">
        <div id="status">Clutch Disengaged (Paused)</div>
        <div style="margin: 20px 0;">
            <span style="color:#888; font-size:0.9rem;">CURRENT SECTOR</span><br>
            <div id="sector-display" style="font-size:2rem; font-weight:bold;">-</div>
        </div>
    
        <button id="btn-system-toggle" style="
                padding: 15px 30px; 
                font-size: 1.2rem; 
                background: #ff4444; 
                color: white; 
                border: none; 
                border-radius: 50px; 
                margin-top: 30px;
                box-shadow: 0 4px 10px rgba(0,0,0,0.3);">
            Stop Browsing
        </button>
    
        <p class="instruction" style="margin-top:20px; color:#aaa;">
            Press button to Pause/Resume the compass.
        </p>
    </div>

    <script src="data.js"></script>
    <script src="script.js"></script>
</body>

</html>
